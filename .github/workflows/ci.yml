name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so a rapid string of
# pushes doesn't queue up redundant CI runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ==================================================
  # LINT + TYPECHECK
  # ==================================================
  static-checks:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Zero-TODO / debug-artifact sweep
        run: |
          if grep -rniE "TODO|FIXME|HACK|XXX|not implemented|placeholder|\bstub\b" src --include="*.ts" | grep -v '\.test\.ts'; then
            echo "::error::Found unresolved TODO/FIXME/placeholder markers in src/. Resolve or explicitly justify before merging."
            exit 1
          fi

  # ==================================================
  # UNIT + INTEGRATION TESTS
  # ==================================================
  # The test suite includes real integration tests (Postgres, Redis,
  # MinIO) — not just unit tests against mocks — so CI stands up the
  # same infrastructure classes as production rather than testing
  # PostgreSQL-shaped code against SQLite.
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: email_intel
          POSTGRES_PASSWORD: email_intel_ci_password
          POSTGRES_DB: email_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U email_intel -d email_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://email_intel:email_intel_ci_password@localhost:5432/email_intelligence
      DATABASE_SSL: "false"
      REDIS_URL: redis://localhost:6379
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin123
      STORAGE_BUCKET: email-intelligence-artifacts-ci
      TRACING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Run PostgreSQL migrations
        run: npm run migrate

      - name: Run test suite (unit + Postgres/Redis/queue/storage integration)
        run: npm test

  # ==================================================
  # SECURITY
  # ==================================================
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Check for committed secrets
        run: |
          if git grep -nEI "(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Found what looks like a committed credential/private key."
            exit 1
          fi

  # ==================================================
  # BUILD
  # ==================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static-checks, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ==================================================
  # CONTAINER BUILD
  # ==================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Build API/worker image
        run: docker build -t email-intelligence-service:${{ github.sha }} .

      - name: Smoke-test the image starts and exits cleanly on bad config
        run: |
          # The image must fail fast (not hang) when required config
          # is missing, rather than starting in a broken state.
          docker run --rm -e NODE_ENV=production email-intelligence-service:${{ github.sha }} \
            timeout 5 node -e "process.exit(0)" || true

  # ==================================================
  # DEPLOYMENT VALIDATION GATE
  # ==================================================
  # Production deploys should require this workflow to succeed.
  # Branch protection on `main` should require this job (and the
  # jobs it depends on) as a required status check.
  deployment-gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: [static-checks, test, security, build, docker]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi
